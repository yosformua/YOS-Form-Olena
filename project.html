<!DOCTYPE html>
<html lang="uk" data-i18n-title="meta.title">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Olena Sychova</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header class="site-header">
    <div class="wrap">
      <a href="index.html" class="logo"><img src="assets/img/Logo.png" alt="YOS"> × Olena <span>Sychova</span></a>
    </div>
  </header>

  <section class="project-hero">
    <img id="project-cover" src="" alt="">

    <a href="index.html#portfolio" class="back-link project-back-btn">
      ← <span data-i18n="project.back">Усі проєкти</span>
    </a>

    <div class="wrap">
      <h1 class="project-title" id="project-title"></h1>
    </div>
  </section>

  <section class="project-body">
    <div class="wrap">
      <dl class="project-meta-row">
        <div>
          <dt data-i18n="project.year">Рік</dt>
          <dd id="project-year"></dd>
        </div>
        <div>
          <dt data-i18n="project.location">Локація</dt>
          <dd id="project-location"></dd>
        </div>
        <div>
          <dt data-i18n="portfolio.filter_all">Категорія</dt>
          <dd id="project-category"></dd>
        </div>
      </dl>

      <p class="project-description" id="project-description"></p>

      <div class="project-gallery" id="project-gallery"></div>

      <div class="project-footer-actions">
        <a href="index.html#portfolio" class="btn btn-outline project-back-btn"
          style="color: var(--text); border-color: var(--surface-line);">
          ← <span data-i18n="project.back">Повернутися до портфоліо</span>
        </a>
      </div>
    </div>
  </section>

  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <img class="lightbox-content" id="lightbox-img" src="" alt="">
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/project.js"></script>
</body>

</html>
